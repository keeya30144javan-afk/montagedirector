name: Build installers

# Push a tag like v0.2.0 to build and publish a release.
# "Run workflow" on the Actions tab builds test installers without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V=$(echo "$GITHUB_REF_NAME" | sed -E "s/^[vV.]+//"); else V=$(python -c "import montage_director as m; print(m.__version__)"); fi
          echo "::notice::Building version $V"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          printf '"""Montage Director: AI-assisted beat-synced AMV / GMV / montage editor."""\n\n__version__ = "%s"\n' "$V" > montage_director/__init__.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller MontageDirector.spec --noconfirm
      - name: Smoke test the built app
        shell: bash
        run: dist/MontageDirector/MontageDirector.exe make --help
      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Output "::error::Inno Setup (ISCC.exe) was not found after installing it"; exit 1 }
          $out = & $iscc "/DAppVersion=$env:VERSION" "installer\MontageDirector.iss" 2>&1
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0) {
            $tail = ($out | Select-Object -Last 6) -join " | "
            Write-Output "::error::Inno Setup failed ($code): $tail"
            exit $code
          }
          Get-ChildItem dist\MontageDirector-Setup-*.exe | ForEach-Object { Write-Output "::notice::Built $($_.Name) ($([math]::Round($_.Length / 1MB)) MB)" }
      - uses: actions/upload-artifact@v4
        with:
          name: MontageDirector-Windows
          path: dist/MontageDirector-Setup-*.exe
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MontageDirector-Setup-*.exe
          generate_release_notes: true

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V=$(echo "$GITHUB_REF_NAME" | sed -E "s/^[vV.]+//"); else V=$(python -c "import montage_director as m; print(m.__version__)"); fi
          echo "::notice::Building version $V"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          printf '"""Montage Director: AI-assisted beat-synced AMV / GMV / montage editor."""\n\n__version__ = "%s"\n' "$V" > montage_director/__init__.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller MontageDirector.spec --noconfirm
      - name: Build disk image
        run: |
          hdiutil create -volname "Montage Director" -srcfolder "dist/Montage Director.app" -ov -format UDZO "dist/MontageDirector-$VERSION-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: MontageDirector-macOS
          path: dist/MontageDirector-*-mac.dmg
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MontageDirector-*-mac.dmg
