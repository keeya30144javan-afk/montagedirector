name: Build installers

# Push a tag like v0.2.0 to build and publish a release.
# "Run workflow" on the Actions tab builds test installers without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(python -c "import re;print(re.search(r'\"(.+?)\"', open('montage_director/__init__.py').read()).group(1))"); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" montage_director/__init__.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller MontageDirector.spec --noconfirm
      - name: Smoke test the built app
        shell: bash
        run: dist/MontageDirector/MontageDirector.exe make --help
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\MontageDirector.iss
      - uses: actions/upload-artifact@v4
        with:
          name: MontageDirector-Windows
          path: dist/MontageDirector-Setup-*.exe
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MontageDirector-Setup-*.exe
          generate_release_notes: true

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(python -c "import re;print(re.search(r'\"(.+?)\"', open('montage_director/__init__.py').read()).group(1))"); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          sed -i '' "s/^__version__ = .*/__version__ = \"$V\"/" montage_director/__init__.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller MontageDirector.spec --noconfirm
      - name: Build disk image
        run: |
          hdiutil create -volname "Montage Director" -srcfolder "dist/Montage Director.app" -ov -format UDZO "dist/MontageDirector-$VERSION-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: MontageDirector-macOS
          path: dist/MontageDirector-*-mac.dmg
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MontageDirector-*-mac.dmg
